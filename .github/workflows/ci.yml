name: CI

# Se ejecuta en cada envío y en cada propuesta de cambio. Un repositorio sin
# integración continua obliga a fiarse de que quien envió el cambio ejecutó las
# pruebas. Nadie las ejecuta siempre.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pruebas
        run: python -m pytest --cov=kalman --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff mypy pandas-stubs

      - name: Estilo
        run: ruff check kalman tests

      - name: Formato
        run: ruff format --check kalman tests

      - name: Tipos del núcleo
        run: mypy kalman/core kalman/billing kalman/security

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Una clave de Stripe publicada en un repositorio se explota en minutos.
      # Los rastreadores automáticos escanean GitHub constantemente.
      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar que no hay datos de clientes
        run: |
          if git ls-files | grep -E '\.(csv|xlsx|xls)$' | grep -v '^tests/fixtures/'; then
            echo "Hay ficheros de datos en el repositorio. Nunca deben subirse."
            exit 1
          fi
