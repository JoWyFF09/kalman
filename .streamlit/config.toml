# Tema base de Streamlit.
#
# Lo que se puede hacer aqui es limitado, asi que esto solo fija fondo, texto
# y color de acento para que los controles propios de Streamlit no queden a
# medio camino. El resto del sistema de diseno vive en kalman/web/theme.py.
#
# El acento es blanco a proposito. La accion principal es blanco sobre negro,
# monocroma. Un color de marca en cada boton hace que todo grite a la vez.

[theme]
base = "dark"
primaryColor = "#FFFFFF"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#151515"
textColor = "#FFFFFF"
font = "sans serif"

[server]
# Los ficheros que sube un cliente pueden ser grandes. 50 MB cubre un volcado
# de CRM de varios cientos de miles de filas.
maxUploadSize = 50

[browser]
gatherUsageStats = false
