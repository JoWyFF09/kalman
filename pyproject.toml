[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalman"
version = "2.0.0"
description = "Validación y limpieza de datos de clientes españoles: NIF, CIF, NIE, IBAN, contacto y duplicados."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["nif", "cif", "iban", "data-quality", "gdpr", "spain", "deduplication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

# El núcleo depende sólo de pandas y numpy. Es lo que permite instalarlo en
# cualquier sitio en segundos. Todo lo demás es opcional y va por extras.
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.40",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
]
db = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]
billing = [
    "stripe>=11.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "faker>=30.0",
]

[project.scripts]
kalman = "kalman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kalman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Un aviso de obsolescencia en nuestro código debe romper la prueba, para
# enterarnos el día que pandas o Python retiren algo que usamos. Los avisos de
# las dependencias entre sí no los podemos arreglar y no deben bloquear la
# batería. En pytest gana el filtro declarado más abajo.
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::DeprecationWarning:kalman",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    # El motor usa nombres de campo en inglés y mensajes en español a
    # propósito: el código es internacional, el producto es español.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# En las pruebas se permiten aserciones y valores literales de ejemplo.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# El núcleo es el contrato del producto y se exige tipado estricto. La capa
# web puede ser más laxa porque Streamlit no está bien tipado.
[[tool.mypy.overrides]]
module = "kalman.web.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["streamlit.*", "fpdf.*", "stripe.*", "psycopg_pool.*"]
ignore_missing_imports = true
